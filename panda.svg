<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ears -->
  <circle cx="14" cy="15" r="10" fill="#1d1d1f"/>
  <circle cx="50" cy="15" r="10" fill="#1d1d1f"/>
  <circle cx="14" cy="15" r="4.5" fill="#4a4a4f"/>
  <circle cx="50" cy="15" r="4.5" fill="#4a4a4f"/>
  <!-- head -->
  <ellipse cx="32" cy="36" rx="26" ry="24" fill="#ffffff" stroke="#1d1d1f" stroke-width="2.5"/>
  <!-- eye patches -->
  <ellipse cx="21" cy="33" rx="7.5" ry="9.5" fill="#1d1d1f" transform="rotate(-28 21 33)"/>
  <ellipse cx="43" cy="33" rx="7.5" ry="9.5" fill="#1d1d1f" transform="rotate(28 43 33)"/>
  <!-- eyes -->
  <circle cx="22.5" cy="32" r="3" fill="#ffffff"/>
  <circle cx="41.5" cy="32" r="3" fill="#ffffff"/>
  <circle cx="23.2" cy="32.4" r="1.6" fill="#1d1d1f"/>
  <circle cx="40.8" cy="32.4" r="1.6" fill="#1d1d1f"/>
  <!-- nose + mouth -->
  <ellipse cx="32" cy="43" rx="4.2" ry="3" fill="#1d1d1f"/>
  <path d="M32 46 v3 M32 49 q-3.5 3 -6.5 0.5 M32 49 q3.5 3 6.5 0.5" fill="none" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round"/>
  <!-- cheeks -->
  <circle cx="15" cy="45" r="3" fill="#ffb3c1" opacity="0.7"/>
  <circle cx="49" cy="45" r="3" fill="#ffb3c1" opacity="0.7"/>
</svg>
